<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Resistência</title>
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Courier New', Courier, monospace;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .logo-container {
            margin-bottom: 30px;
        }

        .logo {
            max-width: 300px;
            width: 100%;
            height: auto;
            filter: drop-shadow(0 0 10px rgba(255, 255, 255, 0.3));
        }

        .mensagem {
            font-size: 1.5rem;
            letter-spacing: 2px;
            line-height: 1.6;
            text-transform: uppercase;
            animation: glitch 1s linear infinite alternate;
        }

        .destaque {
            color: #ff3333;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="logo-container">
        <!-- Substitua 'logo.jpg' pelo nome correto do arquivo da imagem da logo -->
        <img src="logo.png" alt="Logo Nullsec" class="logo">
    </div>

    <div class="mensagem">
        A <span class="destaque">nullsec</span> está nos vigiando.<br>Junte-se a nós.
    </div>

</body>
</html>
